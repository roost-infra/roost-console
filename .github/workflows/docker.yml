name: docker

# Build an amd64 Console API image and expose it as a downloadable artifact.
# The Compose host has no registry credentials yet, so the deploy step loads the
# tar directly. Once a registry is available, switch push/load to push: true.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: roost-console-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image
        run: |
          mkdir -p build
          docker save roost-console-api:${{ github.sha }} | gzip -1 > build/console-api-image.tgz
          docker image inspect roost-console-api:${{ github.sha }} --format '{{.Id}} {{.Size}}'
      - uses: actions/upload-artifact@v4
        with:
          name: console-api-image
          path: build/console-api-image.tgz
          retention-days: 3
