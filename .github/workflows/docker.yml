name: docker

# Build and publish the amd64 Console API image to GHCR. The Compose host pulls
# the same tag from GHCR.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: roost-infra

jobs:
  console-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: JingxuanC
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/console-api:${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/console-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image artifact
        run: |
          mkdir -p build
          docker save ghcr.io/roost-infra/console-api:${{ github.sha }} | gzip -1 > build/console-api-image.tgz
          ls -lh build/console-api-image.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: console-api-image
          path: build/console-api-image.tgz
          retention-days: 3
