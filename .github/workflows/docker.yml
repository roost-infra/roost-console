name: docker

# Build and publish the amd64 Console API image to Aliyun ACR. The Compose host
# pulls the same tag from ACR.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_REGISTRY: crpi-ivhraklhypkzsg0g.ap-southeast-1.personal.cr.aliyuncs.com
  ACR_NAMESPACE: roost-infra

jobs:
  console-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/console-api:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/console-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
